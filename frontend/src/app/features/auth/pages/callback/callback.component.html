<div class="callback-page">
  <div class="callback-panel">
    <div class="callback-content">
      <!-- Logo -->
      <div class="logo-wrapper">
        <div class="icon-glow"></div>
        <mat-icon class="logo">directions_bus</mat-icon>
      </div>

      <!-- Loading State -->
      <div *ngIf="!errorMessage" class="loading-container">
        <div class="spinner-wrapper">
          <div class="spinner-glow"></div>
          <mat-spinner diameter="80" class="loading-spinner"></mat-spinner>
        </div>
        <h2>Bejelentkezés folyamatban...</h2>
        <p class="subtitle">Kérjük, várj, amíg hitelesítjük a bejelentkezésedet</p>
      </div>

      <!-- Error State -->
      <div *ngIf="errorMessage" class="error-container">
        <div class="error-icon-wrapper">
          <div class="error-glow"></div>
          <mat-icon class="error-icon">error</mat-icon>
        </div>
        <h2>Bejelentkezés sikertelen</h2>
        <div class="error-message">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>
        <p class="error-text">
          Hiba történt a bejelentkezés során. Kérjük, próbáld újra.
        </p>
        <button
          mat-raised-button
          routerLink="/login"
          class="action-button"
        >
          <mat-icon>arrow_back</mat-icon>
          <span>Vissza a bejelentkezéshez</span>
        </button>
      </div>

      <!-- Footer -->
      <p class="footer-text" *ngIf="errorMessage">
        Probléma merült fel?
        <a href="mailto:info&#64;kozlekedes.hu">Segítünk</a>
      </p>
    </div>
  </div>
</div>
