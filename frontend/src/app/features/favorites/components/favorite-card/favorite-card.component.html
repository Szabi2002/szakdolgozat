<mat-card class="favorite-card" [class.compact]="compact" (click)="onSelect($event)">
  <div class="card-header">
    <div class="header-icon">
      <mat-icon>favorite</mat-icon>
    </div>
    <div class="header-title">
      <h3>{{ favorite.name }}</h3>
    </div>
  </div>

  <mat-card-content>
    <div class="route-info">
      <div class="info-row from-stop">
        <div class="stop-icon">
          <mat-icon>trip_origin</mat-icon>
        </div>
        <div class="stop-content">
          <span class="label">Honnan</span>
          <span class="value">{{ favorite.from_stop?.name || 'Ismeretlen' }}</span>
        </div>
      </div>

      <div class="route-arrow">
        <mat-icon>south</mat-icon>
      </div>

      <div class="info-row to-stop">
        <div class="stop-icon">
          <mat-icon>place</mat-icon>
        </div>
        <div class="stop-content">
          <span class="label">Hova</span>
          <span class="value">{{ favorite.to_stop?.name || 'Ismeretlen' }}</span>
        </div>
      </div>

      @if (!compact) {
        <div class="info-row created-date">
          <mat-icon>event</mat-icon>
          <div class="date-content">
            <span class="label">Létrehozva</span>
            <span class="value">{{ formatDate(favorite.created_at) }}</span>
          </div>
        </div>
      }
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button
      mat-raised-button
      class="select-btn"
      (click)="onSelect($event)"
      [attr.aria-label]="'Kedvenc kiválasztása: ' + favorite.name">
      <mat-icon>route</mat-icon>
      <span>Útvonal Keresése</span>
    </button>

    <div class="action-buttons">
      <button
        mat-icon-button
        class="edit-btn"
        (click)="onEdit($event)"
        matTooltip="Szerkesztés"
        [attr.aria-label]="'Kedvenc szerkesztése: ' + favorite.name">
        <mat-icon>edit</mat-icon>
      </button>

      <button
        mat-icon-button
        class="delete-btn"
        (click)="onDelete($event)"
        matTooltip="Törlés"
        [attr.aria-label]="'Kedvenc törlése: ' + favorite.name">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </mat-card-actions>
</mat-card>
