<div #mapContainer class="map-container"></div>

@if (routes.length > 0) {
  <div class="map-legend">
    <div class="legend-title">Járattípusok</div>
    <div class="legend-item">
      <span class="legend-color bus"></span>
      <span class="legend-label">Busz</span>
    </div>
    <div class="legend-item">
      <span class="legend-color tram"></span>
      <span class="legend-label">Villamos</span>
    </div>
    <div class="legend-item">
      <span class="legend-color metro"></span>
      <span class="legend-label">Metró</span>
    </div>
  </div>
}
