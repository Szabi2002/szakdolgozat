<div class="favorite-card modern-card" [class.compact]="compact" (click)="onSelect($event)" tabindex="0"
  (keydown.enter)="onSelect($event)" (keydown.space)="onSelect($event)">
  <!-- Modern Minimalist Favorite Card (Modeled after Ticket Card) -->
  <div class="card-main">
    <!-- Visual Status Strip (Left Border) handled by SCSS -->

    <!-- 1. Header: Icon & Name -->
    <div class="card-header-row">
      <div class="type-info">
        <div class="icon-badge">
          <mat-icon>favorite</mat-icon>
        </div>
        <div class="text-content">
          <h3 class="favorite-name">{{ favorite.name }}</h3>
          <span class="favorite-label">Mentett útvonal</span>
        </div>
      </div>

      <!-- Edit/Delete Actions (Top Right) -->
      <div class="top-actions">
        <button mat-icon-button class="action-icon-btn edit-btn" (click)="onEdit($event)" matTooltip="Szerkesztés">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button class="action-icon-btn delete-btn" (click)="onDelete($event)" matTooltip="Törlés">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>

    <!-- 2. Body: Stops Info -->
    <div class="card-body-row">
      <!-- From Stop -->
      <div class="info-block">
        <span class="label">Honnan</span>
        <div class="value-row">
          <mat-icon class="stop-icon from">trip_origin</mat-icon>
          <span class="value">{{ favorite.from_stop?.name || 'Ismeretlen' }}</span>
        </div>
      </div>

      <!-- Arrow Separator (Vertical or Horizontal) -->
      <div class="connector-line">
        <div class="line"></div>
        <mat-icon>arrow_downward</mat-icon>
      </div>

      <!-- To Stop -->
      <div class="info-block">
        <span class="label">Hova</span>
        <div class="value-row">
          <mat-icon class="stop-icon to">place</mat-icon>
          <span class="value">{{ favorite.to_stop?.name || 'Ismeretlen' }}</span>
        </div>
      </div>
    </div>

    <!-- 3. Footer: Primary Action -->
    <div class="card-footer-row">
      <!-- Created Date (Subtle) -->
      <div class="meta-info" *ngIf="!compact">
        <mat-icon>event</mat-icon>
        <span>{{ formatDate(favorite.created_at) }}</span>
      </div>

      <button mat-flat-button class="search-action-btn" (click)="onSelect($event)">
        <mat-icon>search</mat-icon>
        <span>Keresés</span>
      </button>
    </div>
  </div>
</div>
