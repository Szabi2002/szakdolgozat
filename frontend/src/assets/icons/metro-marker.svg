<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 56" width="40" height="56">
  <!-- Marker teardrop shape -->
  <path d="M20 0 C25 0 40 15 40 28 C40 42 20 56 20 56 C20 56 0 42 0 28 C0 15 15 0 20 0 Z" fill="#3F51B5" stroke="#283593" stroke-width="1"/>
  
  <!-- Metro icon inside marker -->
  <g transform="translate(20, 20)">
    <!-- Metro train body (sleeker) -->
    <rect x="-7" y="-3" width="14" height="6" fill="white" stroke="white" stroke-width="0.5" rx="1"/>
    <!-- Metro windows (4 compartments) -->
    <rect x="-6" y="-1.5" width="2" height="2" fill="#1976D2" opacity="0.8"/>
    <rect x="-2" y="-1.5" width="2" height="2" fill="#1976D2" opacity="0.8"/>
    <rect x="2" y="-1.5" width="2" height="2" fill="#1976D2" opacity="0.8"/>
    <rect x="6" y="-1.5" width="2" height="2" fill="#1976D2" opacity="0.8"/>
    <!-- Metro front design -->
    <circle cx="-7" cy="0" r="0.8" fill="white" opacity="0.6"/>
  </g>
</svg>
